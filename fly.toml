# fly.toml app configuration file generated for wrkshp on 2026-08-11T20:31:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wrkshp'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'wrkshp_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
